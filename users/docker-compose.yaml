services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: userDB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d workhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/migrator -mig /app/internal/infrastructure/persistence/postgres/migrations -cmd up -steps 1
    environment:
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
      - ./internal/infrastructure/persistence/postgres/migrations:/app/internal/infrastructure/persistence/postgres/migrations
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/server
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata: