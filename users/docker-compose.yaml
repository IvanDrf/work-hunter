version: '3.9'

services:
  database:
    image: postgres:17.10
    container_name: user_database_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user_app
    restart: on-failure
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    name: app_network
    driver: bridge