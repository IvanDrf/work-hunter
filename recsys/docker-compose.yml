services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_recsys_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .                 
    container_name: recsys_api
    ports:
      - "8000:8000"          
    depends_on:
      - qdrant               
    volumes:
      - ./hf_cache:/app/cache/huggingface
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333