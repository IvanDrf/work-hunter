version: '3.9'

services:
  database:
    image: postgres:17.10
    container_name: vacancy_database
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

    networks:
    - vacancy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: vacancy/Dockerfile
    container_name: vacancy_app
    restart: always
    ports:
      - "${APP_PORT}:50052"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - vacancy_network
    restart: on-failure

volumes:
  pgdata:

networks:
  vacancy_network:
    driver: bridge


