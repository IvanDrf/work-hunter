version: '3.9'

services:
  database:
    image: postgres:17.10
    container_name: vacancy_database
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_OUTPUT_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

    networks:
    - vacancy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8.6
    container_name: vacancy_cache
    restart: always

    ports:
      - "${REDIS_OUTPUT_PORT}:6379"

    volumes:
      - redis_data:/data
    networks:
      - vacancy_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3
    container_name: vacancy_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - vacancy_network


  vacancy_app:
    build:
      context: ..
      dockerfile: vacancy/Dockerfile
    container_name: vacancy_app
    ports:
      - "${APP_PORT}:50052"
      - "${METRICS_PORT}:5665"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      
    networks:
      - vacancy_network
      - shared_network
    restart: on-failure

volumes:
  pgdata:
  redis_data:

networks:
  vacancy_network:
    name: vacancy_network
    driver: bridge
  
  shared_network:
    external: true
    name: shared_network
    driver: bridge


