version: '3.9'

services:
  database:
    image: postgres:17.10
    container_name: vacancy_database
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

    networks:
    - vacancy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8.6
    container_name: vacancy_cache
    restart: always

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data
    networks:
      - vacancy_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  broker:
    image: rabbitmq:4.3.0
    container_name: vacancy_broker
    ports:
      - "${RABBITMQ_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vacancy_network
      - shared_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  app:
    build:
      context: ..
      dockerfile: vacancy/Dockerfile
    container_name: vacancy_app
    ports:
      - "${APP_PORT}:50052"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      broker:
        condition: service_healthy
      
    networks:
      - vacancy_network
      - shared_network
    restart: on-failure

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:

networks:
  vacancy_network:
    driver: bridge
  
  shared_network:
    driver: bridge
    external: true


