version: '3.9'

services:
  postgres:
    image: postgres:18.1
    container_name: test_postgres_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: vacancy_test
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d vacancy_test" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
