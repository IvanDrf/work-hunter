version: '3.9'

services:
  database:
    container_name: validation_redis
    restart: always
    image: redis:8.6
    ports:
      - "${REDIS_OUTPUT_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - validation_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3
    container_name: validation_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - validation_network

  grafana:
    image: grafana/grafana:nightly-slim
    container_name: validation_grafana
    environment:
      - "GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}"
      - "GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - validation_network

  validation_app:
    container_name: validation_app
    build: .
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      database:
        condition: service_healthy

    networks:
      - shared_network
      - validation_network

volumes:
  redis_data:
  grafana-storage:

networks:
  shared_network:
    driver: bridge
    name: shared_network
  validation_network:
    driver: bridge
    name: validation_network