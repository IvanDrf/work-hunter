syntax = "proto3";

package vacancy;

import "common.proto";

service ApplicationService {
    rpc Health(common.Empty) returns (common.ServiceStatus);
    
    rpc UpdateApplications(UpdateApplicationsRequest) returns (common.Response);

    rpc FindVacanciesIDByUserID(FindVacanciesIDByUserIDRequest) returns (FindVacanciesIDByUserIDResponse);
}


message UpdateApplicationsRequest {
    uint64 vacancy_id = 1;
    string user_id = 2; // uuid

    common.UserInfo user_info = 3;
}

message FindVacanciesIDByUserIDRequest {
    string user_id = 1;

    common.UserInfo user_info = 2;
}

message FindVacanciesIDByUserIDResponse {
    string user_id = 1;

    repeated string vacancies_ids = 2;
}