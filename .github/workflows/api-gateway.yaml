name: Run [API-GATEWAY] tests

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./api-gateway
          args: --timeout=5m

      - name: Run Go tests
        working-directory: ./api-gateway/tests
        run: go test -v ./...
