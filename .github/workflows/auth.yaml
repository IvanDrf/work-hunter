name: Run [AUTH] tests

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup GO
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./auth
          args: --timeout=5m

      - name: Run GO tests for [AUTH]
        working-directory: ./auth/tests
        run: |
          go mod download
          go test ./...
